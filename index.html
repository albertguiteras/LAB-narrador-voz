<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrador de Voz (Web Speech API)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h1>🗣️ Narrador de Texto a Voz</h1>
        <p>Escribe cualquier texto y pulsa el botón para escucharlo:</p>

        <textarea id="textoInput" rows="4" placeholder="Escribe algo aquí para que el navegador lo lea...">Hola! Este es un ejercicio del curso de Ironhack con la Web Speech API.</textarea>

        <div class="controles">
            <button id="btnHablar">🔊 Escuchar</button>
            <button id="btnParar">⏹️ Detener</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
